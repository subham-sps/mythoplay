<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Animal Match Safari</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #bbf7d0 0%, #86efac 40%, #4ade80 100%);
    overflow: hidden;
    touch-action: manipulation;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }
  h1 {
    font-size: clamp(20px, 5vw, 32px);
    color: #14532d;
    margin: 4px 0 2px;
    text-shadow: 0 2px 0 #fff;
  }
  #status {
    font-size: clamp(14px, 3.5vw, 18px);
    color: #166534;
    font-weight: 800;
    margin-bottom: 8px;
  }
  #board {
    display: grid;
    gap: 10px;
    width: min(92vw, 520px);
    flex: 1;
    max-height: 74vh;
  }
  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    cursor: pointer;
    perspective: 800px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(.4,1.8,.6,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner, .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 8vw, 48px);
    backface-visibility: hidden;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 6px 12px rgba(0,0,0,0.15);
  }
  .card-back {
    background: linear-gradient(160deg, #22c55e, #15803d);
    color: #fff;
    font-size: clamp(20px, 6vw, 30px);
  }
  .card-front {
    background: #fff;
    transform: rotateY(180deg);
  }
  .card.matched .card-front {
    background: #fef9c3;
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  #win {
    position: fixed; inset: 0;
    background: rgba(20, 83, 45, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  #win h2 { font-size: clamp(26px, 7vw, 40px); margin: 0 0 8px; }
  #win button, #restart {
    margin-top: 14px;
    background: #fff;
    color: #166534;
    border: none;
    font-weight: 800;
    font-size: 18px;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  #topbar { display: flex; gap: 10px; align-items: center; }
  #restart {
    margin-top: 0;
    background: rgba(255,255,255,0.85);
    padding: 6px 16px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <h1>🦁 Animal Match Safari</h1>
  <div id="topbar">
    <div id="status">Moves: 0</div>
    <button id="restart">🔄 New Round</button>
  </div>
  <div id="board"></div>
</div>
<div id="win">
  <h2>🎉 Great Job! 🎉</h2>
  <p id="winMsg">You matched every animal!</p>
  <button id="playAgain">Play Again</button>
</div>
<script>
  const ANIMALS = ['🐵','🦁','🐸','🐶','🐱','🦊','🐼','🐨','🐷','🐰','🐯','🐮'];
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const winScreen = document.getElementById('win');
  const winMsg = document.getElementById('winMsg');

  let pairsCount = 6; // 12 cards -> good for young kids
  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let lock = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function columnsFor(n) {
    if (n <= 8) return 4;
    return 4;
  }

  function newGame() {
    matchedCount = 0;
    moves = 0;
    flipped = [];
    lock = false;
    status.textContent = 'Moves: 0';
    winScreen.style.display = 'none';

    const chosen = shuffle([...ANIMALS]).slice(0, pairsCount);
    cards = shuffle([...chosen, ...chosen]);

    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${columnsFor(cards.length)}, 1fr)`;

    cards.forEach((animal, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = idx;
      card.dataset.animal = animal;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">🌿</div>
          <div class="card-face card-front">${animal}</div>
        </div>`;
      card.addEventListener('click', () => onCardClick(card));
      board.appendChild(card);
    });
  }

  function onCardClick(card) {
    if (lock) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flipped.length === 2) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves++;
      status.textContent = 'Moves: ' + moves;
      lock = true;
      const [a, b] = flipped;
      if (a.dataset.animal === b.dataset.animal) {
        setTimeout(() => {
          a.classList.add('matched');
          b.classList.add('matched');
          matchedCount++;
          flipped = [];
          lock = false;
          if (matchedCount === pairsCount) {
            setTimeout(showWin, 400);
          }
        }, 350);
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 800);
      }
    }
  }

  function showWin() {
    winMsg.textContent = `You matched every animal in ${moves} moves!`;
    winScreen.style.display = 'flex';
  }

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('playAgain').addEventListener('click', newGame);

  newGame();
</script>
</body>
</html>

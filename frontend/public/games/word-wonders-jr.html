<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Word Wonders Jr</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&family=Outfit:wght@600;700;800;900&family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;position:fixed;width:100%;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;touch-action:none;transition:background .5s;}

  /* theme switcher */
  .switch{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:50px;backdrop-filter:blur(8px);}
  .switch button{border:none;cursor:pointer;background:transparent;color:#fff;font-family:'Outfit';font-weight:800;font-size:11px;padding:6px 11px;border-radius:50px;opacity:.7;transition:.2s;white-space:nowrap;}
  .switch button.active{background:#fff;color:#222;opacity:1;}

  .game{width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;padding:12px;padding-top:44px;position:relative;}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .place{font-weight:800;font-size:16px;}
  .hudR{display:flex;align-items:center;gap:7px;}
  .gems{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:50px;font-family:'Outfit';font-weight:800;font-size:14px;}
  .lvl{padding:6px 11px;border-radius:50px;font-family:'Outfit';font-weight:800;font-size:12px;}
  .iconbtn{border:none;cursor:pointer;width:38px;height:38px;border-radius:50%;font-size:17px;transition:transform .12s;}
  .iconbtn:active{transform:scale(.9);}
  .gridWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:4px;min-height:0;}
  .grid{display:grid;gap:5px;}
  .cell{width:var(--cs);height:var(--cs);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:900;font-size:calc(var(--cs)*.5);text-transform:uppercase;}
  .cell.empty{background:transparent;box-shadow:none!important;}
  .cell.filled{animation:plop .35s cubic-bezier(.34,1.7,.5,1);}
  @keyframes plop{0%{transform:scale(.3);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .mascot{display:flex;align-items:flex-end;gap:8px;margin-bottom:4px;min-height:52px;}
  .face{font-size:36px;flex:0 0 auto;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
  .speech{border-radius:16px 16px 16px 4px;padding:8px 13px;font-weight:600;font-size:14px;flex:1;min-height:34px;display:flex;align-items:center;}
  .speech.think{opacity:.6;font-style:italic;}
  .preview{height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
  .bubble{padding:6px 20px;border-radius:50px;font-family:'Outfit';font-weight:900;font-size:23px;letter-spacing:3px;text-transform:uppercase;min-width:56px;text-align:center;}
  .bubble:empty{opacity:0;}
  .bubble.good{animation:pop .4s;}.bubble.bonus{animation:pop .4s;}.bubble.bad{animation:shake .4s;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.14);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  .wheelArea{position:relative;height:264px;margin:0 auto 2px;width:264px;touch-action:none;}
  .wheelBg{position:absolute;inset:0;border-radius:50%;}
  svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
  .letter{position:absolute;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-weight:900;font-size:25px;text-transform:uppercase;transform:translate(-50%,-50%);z-index:3;transition:transform .12s,background .12s,box-shadow .12s;pointer-events:none;}
  .tools{display:flex;gap:10px;justify-content:center;margin-bottom:2px;}
  .tool{border:none;cursor:pointer;width:46px;height:46px;border-radius:50%;font-size:20px;transition:transform .12s;}
  .tool:active{transform:scale(.9);}
  .win{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;}
  .win.show{display:flex;animation:winIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes winIn{0%{opacity:0;transform:scale(.9);}100%{opacity:1;transform:scale(1);}}
  .win .em{font-size:80px;animation:float 2.6s ease-in-out infinite;}
  .win h1{font-weight:900;font-size:30px;margin:8px 0 4px;}
  .win p{font-weight:600;opacity:.95;margin-bottom:8px;}
  .win .defs{border-radius:14px;padding:10px 14px;font-size:13px;text-align:left;max-width:300px;margin-bottom:14px;max-height:120px;overflow:auto;}
  .win .defs b{text-transform:uppercase;}
  .win button{border:none;cursor:pointer;font-family:'Outfit';font-weight:900;font-size:18px;padding:14px 32px;border-radius:50px;}
  .win button:active{transform:translateY(3px);}
  .win button.alt{margin-top:10px;font-size:15px;padding:11px 24px;}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60;}
  .confetti i{position:absolute;top:-20px;width:10px;height:13px;animation:drop linear forwards;}
  @keyframes drop{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
  .deftoast{position:absolute;left:12px;right:12px;bottom:78px;z-index:40;border-radius:16px;padding:11px 16px;font-size:14px;font-weight:600;opacity:0;transform:translateY(12px);transition:.3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
  .deftoast.show{opacity:1;transform:translateY(0);}
  .loader{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============ THEME: STORYBOOK ============ */
  body.t-story{background:#F3E7CE;font-family:'Quicksand',sans-serif;color:#5A3E2B;}
  .t-story .place{font-family:'Caveat';font-size:24px;color:#5A3E2B;}
  .t-story .gems{background:#fff;color:#C2602E;border:2px solid #5A3E2B;}
  .t-story .lvl{background:#E2C893;color:#5A3E2B;border:2px solid #5A3E2B;}
  .t-story .iconbtn,.t-story .tool{background:#fff;border:2px solid #5A3E2B;color:#5A3E2B;box-shadow:2px 3px 0 #5A3E2B;}
  .t-story .gridWrap{}
  .t-story .cell:not(.empty){background:#FBF3E0;border:2px dashed #C9A86A;}
  .t-story .cell.filled{background:#fff;border:2px solid #5A3E2B;color:#5A3E2B;box-shadow:2px 3px 0 #C9A86A;}
  .t-story .face{filter:none;}
  .t-story .speech{background:#fff;border:2px solid #5A3E2B;color:#5A3E2B;box-shadow:2px 3px 0 #C9A86A;}
  .t-story .bubble{background:#fff;border:2px solid #5A3E2B;color:#5A3E2B;box-shadow:2px 4px 0 #5A3E2B;}
  .t-story .bubble.good{background:#9CB071;color:#fff;}
  .t-story .bubble.bonus{background:#C2602E;color:#fff;}
  .t-story .bubble.bad{background:#D98B7A;color:#fff;}
  .t-story .wheelBg{background:#FBF3E0;border:3px solid #5A3E2B;box-shadow:inset 0 3px 10px rgba(90,62,43,.15),3px 4px 0 #C9A86A;}
  .t-story .letter{background:#fff;border:2.5px solid #5A3E2B;color:#5A3E2B;box-shadow:2px 4px 0 #5A3E2B;}
  .t-story .letter.on{background:#C2602E;color:#fff;transform:translate(-50%,-50%) scale(1.12);}
  .t-story .win{background:#F3E7CE;color:#5A3E2B;}
  .t-story .win .defs{background:#FBF3E0;border:2px solid #C9A86A;}
  .t-story .win button{background:#C2602E;color:#fff;box-shadow:3px 4px 0 #5A3E2B;}
  .t-story .win button.alt{background:#E2C893;color:#5A3E2B;box-shadow:3px 4px 0 #5A3E2B;}
  .t-story .deftoast{background:#5A3E2B;color:#FBF3E0;}.t-story .deftoast b{color:#E2C893;}
  .t-story svg.lines path{stroke:#C2602E!important;}

  /* ============ THEME: GALAXY ============ */
  body.t-galaxy{background:radial-gradient(130% 110% at 50% -10%,#3A1B6E 0%,#160B33 55%,#0A0620 100%);font-family:'Nunito',sans-serif;color:#EAE6FF;}
  body.t-galaxy::before{content:"";position:fixed;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 15% 80%,#fff,transparent),radial-gradient(1px 1px at 60% 85%,#fff,transparent);background-size:cover;opacity:.5;pointer-events:none;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.35;}50%{opacity:.6;}}
  .t-galaxy .place{color:#fff;text-shadow:0 0 12px rgba(150,120,255,.8);}
  .t-galaxy .gems{background:rgba(255,255,255,.1);color:#7CF0FF;border:1px solid rgba(124,240,255,.4);box-shadow:0 0 14px rgba(124,240,255,.2);}
  .t-galaxy .lvl{background:rgba(255,255,255,.12);color:#fff;}
  .t-galaxy .iconbtn,.t-galaxy .tool{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;}
  .t-galaxy .cell:not(.empty){background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(150,120,255,.3);}
  .t-galaxy .cell.filled{background:linear-gradient(145deg,#7C6BFF,#4DE2FF);color:#0A0620;box-shadow:0 0 16px rgba(124,107,255,.6);}
  .t-galaxy .face{filter:drop-shadow(0 0 8px rgba(124,200,255,.7));}
  .t-galaxy .speech{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#EAE6FF;backdrop-filter:blur(6px);}
  .t-galaxy .bubble{background:rgba(255,255,255,.1);border:1px solid rgba(150,120,255,.5);color:#fff;}
  .t-galaxy .bubble.good{background:linear-gradient(145deg,#2BFFB0,#15c98a);color:#04231a;box-shadow:0 0 22px rgba(43,255,176,.7);}
  .t-galaxy .bubble.bonus{background:linear-gradient(145deg,#9B7BFF,#6C4DFF);color:#fff;box-shadow:0 0 22px rgba(124,107,255,.7);}
  .t-galaxy .bubble.bad{background:#FF5E9C;color:#fff;}
  .t-galaxy .wheelBg{background:rgba(255,255,255,.05);box-shadow:inset 0 0 40px rgba(124,107,255,.25),0 0 30px rgba(124,107,255,.15);border:1px solid rgba(150,120,255,.25);}
  .t-galaxy .letter{background:radial-gradient(circle at 35% 30%,#fff,#C9BFFF);color:#2B1B5E;box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 -3px 6px rgba(120,90,200,.4);}
  .t-galaxy .letter.on{background:linear-gradient(145deg,#7C6BFF,#4DE2FF);color:#fff;transform:translate(-50%,-50%) scale(1.14);box-shadow:0 0 26px rgba(124,107,255,.9);}
  .t-galaxy .win{background:radial-gradient(130% 110% at 50% -10%,#3A1B6E,#0A0620);color:#fff;}
  .t-galaxy .win .defs{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);}
  .t-galaxy .win button{background:linear-gradient(145deg,#7C6BFF,#4DE2FF);color:#06061a;box-shadow:0 0 24px rgba(124,107,255,.6);}
  .t-galaxy .win button.alt{background:rgba(255,255,255,.12);color:#fff;}
  .t-galaxy .deftoast{background:rgba(20,12,50,.95);color:#EAE6FF;border:1px solid rgba(124,107,255,.4);}.t-galaxy .deftoast b{color:#7CF0FF;}
  .t-galaxy svg.lines path{stroke:#7CF0FF!important;filter:drop-shadow(0 0 6px rgba(124,240,255,.8));}

  /* ============ THEME: BUBBLE POP ============ */
  body.t-bubble{background:linear-gradient(170deg,#FF9EC2 0%,#FFB36B 45%,#7CE0FF 100%);font-family:'Baloo 2',sans-serif;color:#5B2A6B;}
  .t-bubble .place{color:#fff;text-shadow:0 2px 0 rgba(160,60,120,.4);font-size:18px;}
  .t-bubble .gems{background:#fff;color:#FF4D9D;box-shadow:0 4px 0 rgba(160,60,120,.25);}
  .t-bubble .lvl{background:rgba(255,255,255,.35);color:#fff;}
  .t-bubble .iconbtn,.t-bubble .tool{background:#fff;color:#FF6BAA;box-shadow:0 4px 0 rgba(160,60,120,.25);}
  .t-bubble .cell:not(.empty){background:rgba(255,255,255,.45);box-shadow:inset 0 2px 4px rgba(160,60,120,.15);}
  .t-bubble .cell.filled{background:#fff;color:#5B2A6B;box-shadow:0 4px 0 rgba(160,60,120,.25),inset 0 2px 3px #fff;}
  .t-bubble .speech{background:#fff;color:#5B2A6B;box-shadow:0 5px 0 rgba(160,60,120,.2);}
  .t-bubble .bubble{background:#fff;color:#5B2A6B;box-shadow:0 6px 0 rgba(160,60,120,.25);}
  .t-bubble .bubble.good{background:linear-gradient(145deg,#5BF0C8,#2BD0A8);color:#fff;box-shadow:0 6px 0 #1BA588;}
  .t-bubble .bubble.bonus{background:linear-gradient(145deg,#C18BFF,#9B5BFF);color:#fff;box-shadow:0 6px 0 #7A3DD8;}
  .t-bubble .bubble.bad{background:linear-gradient(145deg,#FF8FB0,#FF5E8F);color:#fff;box-shadow:0 6px 0 #E03A6E;}
  .t-bubble .wheelBg{background:rgba(255,255,255,.3);box-shadow:inset 0 4px 14px rgba(160,60,120,.2),inset 0 -2px 6px rgba(255,255,255,.6);}
  .t-bubble .letter{background:radial-gradient(circle at 35% 28%,#fff 0%,#FFE0EE 60%,#FFC2DD 100%);color:#C13B7A;box-shadow:0 6px 0 rgba(180,80,130,.35),inset 0 3px 5px rgba(255,255,255,.9),inset 0 -4px 8px rgba(200,100,150,.3);}
  .t-bubble .letter.on{background:radial-gradient(circle at 35% 28%,#fff,#7CE0FF 70%,#3DBEE8);color:#0B5A7A;transform:translate(-50%,-50%) scale(1.16);box-shadow:0 8px 0 rgba(40,120,160,.4),inset 0 3px 6px rgba(255,255,255,.9);}
  .t-bubble .win{background:linear-gradient(170deg,#FF9EC2,#9B5BFF);color:#fff;}
  .t-bubble .win .defs{background:rgba(255,255,255,.2);}
  .t-bubble .win button{background:#fff;color:#FF4D9D;box-shadow:0 6px 0 rgba(160,60,120,.3);}
  .t-bubble .win button.alt{background:rgba(255,255,255,.25);color:#fff;box-shadow:0 6px 0 rgba(160,60,120,.2);}
  .t-bubble .deftoast{background:#5B2A6B;color:#fff;}.t-bubble .deftoast b{color:#7CE0FF;}
  .t-bubble svg.lines path{stroke:#FF4D9D!important;stroke-width:8!important;}

  /* ===== animated background layer (per theme) ===== */
  #bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
  #bgfx .blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.0;transition:opacity .6s;}
  body.t-story #bgfx .b1{opacity:.55;}body.t-galaxy #bgfx .b1{opacity:0;}body.t-bubble #bgfx .b1{opacity:0;}
  /* Storybook: drifting soft clouds + sun */
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.55;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  body:not(.t-story) .story-bg{display:none;}
  .story-bg{position:absolute;inset:0;}
  .story-sun{position:absolute;top:8%;right:12%;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE08A,#F3B94C);box-shadow:0 0 50px rgba(243,185,76,.6);animation:sunPulse 5s ease-in-out infinite;}
  @keyframes sunPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  @keyframes drift{from{transform:translateX(-30vw);}to{transform:translateX(130vw);}}
  /* Galaxy: floating planets + shooting stars */
  body:not(.t-galaxy) .galaxy-bg{display:none;}
  .galaxy-bg{position:absolute;inset:0;}
  .planet{position:absolute;border-radius:50%;animation:floaty 7s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-22px);}}
  .shoot{position:absolute;width:2px;height:90px;background:linear-gradient(#fff,transparent);opacity:0;transform:rotate(45deg);animation:shoot 6s linear infinite;}
  @keyframes shoot{0%{opacity:0;transform:translate(-10vw,-10vh) rotate(45deg);}8%{opacity:.9;}20%{opacity:0;transform:translate(40vw,40vh) rotate(45deg);}100%{opacity:0;}}
  /* Bubble: rising bubbles */
  body:not(.t-bubble) .bubble-bg{display:none;}
  .bubble-bg{position:absolute;inset:0;}
  .rise{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 60%,rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.4);animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:.7;}90%{opacity:.5;}100%{transform:translateY(-110vh) translateX(20px);opacity:0;}}
  /* starburst when a word lands on the grid */
  .starburst{position:fixed;z-index:70;pointer-events:none;width:10px;height:10px;}
  .starburst i{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;animation:spark .6s ease-out forwards;}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
  /* fireworks for round clear */
  .fw{position:fixed;z-index:65;pointer-events:none;width:6px;height:6px;border-radius:50%;}
  .fw i{position:absolute;width:5px;height:5px;border-radius:50%;animation:fwgo 1s ease-out forwards;}
  @keyframes fwgo{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;}}
  .win .em.celebrate{animation:bigpop .8s cubic-bezier(.34,1.7,.5,1);}
  @keyframes bigpop{0%{transform:scale(0) rotate(-30deg);}60%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
  .cell.justfilled{animation:cellPop .5s cubic-bezier(.34,1.9,.5,1)!important;}
  @keyframes cellPop{0%{transform:scale(.3);}55%{transform:scale(1.25);}100%{transform:scale(1);}}


  .switch button{display:inline-flex;align-items:center;gap:6px;}
  .switch .tlogo{width:17px;height:17px;flex:0 0 auto;display:block;}

  /* ===== level transition screen ===== */
  .travel{position:absolute;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  .travel.show{display:flex;animation:travelIn .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes travelIn{0%{opacity:0;}100%{opacity:1;}}
  .travel-inner{display:flex;flex-direction:column;align-items:center;gap:6px;animation:travelRise .55s cubic-bezier(.34,1.56,.64,1);}
  @keyframes travelRise{0%{transform:translateY(24px) scale(.92);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
  .travel-eyebrow{font-family:'Outfit';font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.6;}
  .travel-badge{width:120px;height:120px;border-radius:34px;display:flex;align-items:center;justify-content:center;margin:6px 0 4px;animation:badgeFloat 3s ease-in-out infinite;}
  @keyframes badgeFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
  .travel-ico{width:62px;height:62px;}
  .travel-place{font-family:'Outfit';font-weight:900;font-size:30px;line-height:1.1;}
  .travel-level{font-family:'Outfit';font-weight:700;font-size:16px;opacity:.7;margin-bottom:6px;}
  .travel-path{position:relative;display:flex;align-items:center;gap:14px;height:30px;margin:6px 0 14px;}
  .travel-path .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35;}
  .travel-path .plane{position:absolute;left:-6px;font-size:22px;animation:fly 1.8s ease-in-out infinite;}
  @keyframes fly{0%{left:-6px;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{left:calc(100% - 14px);opacity:0;}}
  .travel-go{border:none;cursor:pointer;font-family:'Outfit';font-weight:900;font-size:19px;padding:14px 38px;border-radius:50px;}
  .travel-go:active{transform:translateY(3px);}
  /* per-theme surfaces for the transition */
  body.t-story .travel{background:#F3E7CE;color:#5A3E2B;}
  body.t-story .travel-badge{background:#FBF3E0;border:3px solid #5A3E2B;box-shadow:3px 5px 0 #C9A86A;}
  body.t-story .travel-go{background:#C2602E;color:#fff;box-shadow:3px 4px 0 #5A3E2B;}
  body.t-galaxy .travel{background:radial-gradient(130% 110% at 50% 0%,#3A1B6E,#0A0620);color:#EAE6FF;}
  body.t-galaxy .travel-badge{background:rgba(255,255,255,.07);border:1px solid rgba(150,120,255,.4);box-shadow:0 0 30px rgba(124,107,255,.4);}
  body.t-galaxy .travel-go{background:linear-gradient(145deg,#7C6BFF,#4DE2FF);color:#06061a;box-shadow:0 0 24px rgba(124,107,255,.6);}
  body.t-bubble .travel{background:linear-gradient(170deg,#FF9EC2,#9B5BFF);color:#fff;}
  body.t-bubble .travel-badge{background:rgba(255,255,255,.25);box-shadow:0 8px 0 rgba(160,60,120,.3),inset 0 2px 6px rgba(255,255,255,.5);}

pe": "animals", "eel": "animals", "ram": "animals", "mare": "animals", "colt": "animals", "calf": "animals", "tiger": "animals", "horse": "animals", "snail": "animals", "otter": "animals", "robin": "animals", "sheep": "animals", "mouse": "animals", "snake": "animals", "stork": "animals", "rabbit": "animals", "tart": "food", "toast": "food", "treat": "food", "stew": "food", "roast": "food", "oats": "food", "salt": "food", "sugar": "food", "apricot": "food", "raisin": "food", "carrot": "food", "tomato": "food", "potato": "food", "onion": "food", "seat": "home", "mat": "home", "net": "home", "tar": "home", "art": "home", "ten": "home", "note": "home", "tile": "home", "stair": "home", "store": "home", "train": "home", "chair": "home", "table": "home", "plate": "home", "stove": "home", "towel": "home", "stool": "home"}

let AC=null,masterGain=null,bgTimer=null,bgPlaying=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(freq,start,dur,type,gain){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=freq;
  const t0=c.currentTime+start;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain||0.18,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

    g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(0.05,c.currentTime+0.1);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.9);

let currentLevel=null;      // the active generated/AI level
let levelNum=1;             // ever-increasing counter (endless)
let aiQueued=null;          // optional AI surprise level to use next
function placeCrossword(rawWords){
  const words=[...new Set(rawWords)].sort((a,b)=>b.length-a.length||a.localeCompare(b));
  const cells={},placements=[],key=(r,c)=>r+','+c;
  function canPlace(word,r,c,d){let crosses=0;
    for(let i=0;i<word.length;i++){const rr=r+(d==='V'?i:0),cc=c+(d==='H'?i:0),cur=cells[key(rr,cc)];
      if(cur!==undefined){if(cur!==word[i])return -1;crosses++;}
      else{if(d==='H'){if(cells[key(rr-1,cc)]!==undefined||cells[key(rr+1,cc)]!==undefined)return -1;}else{if(cells[key(rr,cc-1)]!==undefined||cells[key(rr,cc+1)]!==undefined)return -1;}}}
    if(d==='H'){if(cells[key(r,c-1)]!==undefined||cells[key(r,c+word.length)]!==undefined)return -1;}else{if(cells[key(r-1,c)]!==undefined||cells[key(r+word.length,c)]!==undefined)return -1;}
    return crosses;}
  const first=words[0];for(let i=0;i<first.length;i++)cells[key(0,i)]=first[i];placements.push({word:first,r:0,c:0,dir:'H'});
  for(let w=1;w<words.length;w++){const word=words[w];let best=null;
    for(let i=0;i<word.length;i++)for(const k in cells){if(cells[k]!==word[i])continue;const[pr,pc]=k.split(',').map(Number);
      let cr=canPlace(word,pr-i,pc,'V');if(cr>0&&(!best||cr>best.cr))best={cr,word,r:pr-i,c:pc,dir:'V'};
      cr=canPlace(word,pr,pc-i,'H');if(cr>0&&(!best||cr>best.cr))best={cr,word,r:pr,c:pc-i,dir:'H'};}
    if(!best)return null;
    for(let i=0;i<best.word.length;i++){const rr=best.r+(best.dir==='V'?i:0),cc=best.c+(best.dir==='H'?i:0);cells[key(rr,cc)]=best.word[i];}
    placements.push({word:best.word,r:best.r,c:best.c,dir:best.dir});}
  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
  for(const k in cells){const[r,c]=k.split(',').map(Number);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
  const norm={};for(const k in cells){const[r,c]=k.split(',').map(Number);norm[(r-minR)+','+(c-minC)]=cells[k];}
  return {cells:norm,rows:maxR-minR+1,cols:maxC-minC+1,words:placements.map(p=>({...p,r:p.r-minR,c:p.c-minC}))};
}
/* ===== Local endless level generator ===== */
function buildableU(word,letters){const pool={};letters.forEach(l=>pool[l]=(pool[l]||0)+1);for(const ch of word){if(!pool[ch])return false;pool[ch]--;}return true;}
function shuffleArr(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);}
let recentLevels=[];
function levelKey(words){return words.slice().sort().join('-');}
function tryAssemble(base,minW,maxW){
  const letters=base.split('');                 // FULL letters incl. repeats (wheel = these)
  const fits=ALLWORDS.filter(w=>w!==base&&w.length>=3&&buildableU(w,letters));
  if(fits.length+1<minW)return null;
  // try several random subsets so the same base yields different puzzles
  for(let attempt=0;attempt<24;attempt++){
    const target=Math.min(maxW,Math.max(minW,3+Math.floor(Math.random()*(maxW-2)))); // 3..maxW
    const pick=shuffleArr(fits).slice(0,Math.max(0,target-1));
    const chosen=[base].concat(pick);
    if(chosen.length<minW)continue;
    const lay=placeCrossword(chosen);
    if(lay&&lay.words.length===new Set(chosen).size){
      // require that EVERY chosen word actually got placed (full interlock)
      return chosen;
    }
  }
  return null;
}
let recentBases=[];          // recently used base words
let recentSets=[];           // recently used letter-sets (sorted unique letters)
function setKey(letters){return [...new Set(letters)].sort().join('');}
function generateLevel(minW,maxW){
  minW=minW||3;maxW=maxW||6;
  const bases=shuffleArr(ALLWORDS.filter(w=>w.length>=4&&w.length<=6));
  let firstValid=null,secondValid=null;
  for(const base of bases){
    const chosen=tryAssemble(base,minW,maxW);
    if(!chosen)continue;
    if(!firstValid)firstValid={base,chosen};
    // skip if this exact base, its letter-set, or this word list was used recently
    if(recentBases.includes(base)){continue;}
    if(recentSets.includes(setKey(base.split('')))){if(!secondValid)secondValid={base,chosen};continue;}
    if(recentLevels.includes(levelKey(chosen))){continue;}
    return finalizeLevel(base,chosen);
  }
  // relax constraints gracefully: prefer a different letter-set, else any valid, else fallback
  if(secondValid)return finalizeLevel(secondValid.base,secondValid.chosen);
  if(firstValid){return finalizeLevel(firstValid.base,firstValid.chosen);}
  return {place:'⭐ Word Park',letters:['C','A','T','S'],words:['CATS','CAT','ACT','SAT'],theme:'animals'};
}
function finalizeLevel(base,chosen){
  const theme=WORD_THEME[base.toLowerCase()]||'home';
  const spots=['Park','Land','World','Town','Bay','Hill','Cove','Den','Valley','Island'];
  const place=(THEME_EMOJI[theme]||'⭐')+' '+(THEME_NAME[theme]||'Word')+' '+spots[Math.floor(Math.random()*spots.length)];
  const letters=shuffleArr(base.split(''));   // full letters, jumbled so biggest word isn't pre-spelled
  recentLevels.push(levelKey(chosen));if(recentLevels.length>40)recentLevels.shift();
  recentBases.push(base);if(recentBases.length>25)recentBases.shift();
  recentSets.push(setKey(base.split('')));if(recentSets.length>12)recentSets.shift();
  return {place,letters,words:chosen,theme};
}

function buildable(word,letters){const pool={};letters.forEach(l=>pool[l]=(pool[l]||0)+1);for(const ch of word){if(!pool[ch])return false;pool[ch]--;}return true;}
function bonusWords(letters,grid){const g=new Set(grid);return Object.keys(KIDBANK).map(w=>w.toUpperCase()).filter(w=>buildable(w,letters)&&!g.has(w));}
let lvl=0,gems=0,found=[],bonusFound=[],placed={},LAYOUT=null,bonusList=[];
const $=id=>document.getElementById(id);
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u);}
const FACES={happy:"🦉",cheer:"🥳",think:"🤔",wow:"🤩"};
function mascotSay(t,m){$('face').textContent=FACES[m]||FACES.happy;$('speech').classList.remove('think');$('speech').textContent=t;}
function mascotThink(){$('speech').classList.add('think');$('speech').innerHTML='<span class="loader"></span> thinking...';$('face').textContent=FACES.think;}
async function aiMascotLine(ctx){
  const fb={welcome:["You can do it! Find a word.","Drag the letters to spell something!","Let's make words!"],nice:["Awesome work!","You're so smart!","Yes! Keep going!","Great job!"],bonus:["Wow, a bonus word!","You found a secret word!","Extra clever!"],stuck:["Try the big letter first!","Tap shuffle to mix them!","What sound starts it?"],clear:["You cleared it! Superstar!","All done! Amazing!"]};
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:`You are Lexi, a cheerful owl mascot in a word game for kids age 4-7. Say ONE short warm simple sentence (max 8 words) for: "${ctx}". No emoji. Just the sentence.`}]})});
    const d=await r.json();const t=(d.content||[]).map(b=>b.text||"").join("").trim().replace(/^["']|["']$/g,"");if(t&&t.length<80)return t;throw 0;
  }catch(e){if(ctx.includes("welcome"))return pick(fb.welcome);if(ctx.includes("bonus"))return pick(fb.bonus);if(ctx.includes("cleared"))return pick(fb.clear);if(ctx.includes("stuck"))return pick(fb.stuck);return pick(fb.nice);}
}
async function mascotMoment(ctx,mood){mascotThink();const line=await aiMascotLine(ctx);mascotSay(line,mood);}
let idleTimer=null;function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>mascotMoment("the child seems stuck, gentle hint","think"),12000);}
function renderGrid(){const g=$('grid');g.innerHTML='';const cs=Math.min(44,Math.floor(280/LAYOUT.cols));g.style.setProperty('--cs',cs+'px');g.style.gridTemplateColumns=`repeat(${LAYOUT.cols},${cs}px)`;g.style.gridTemplateRows=`repeat(${LAYOUT.rows},${cs}px)`;
  for(let r=0;r<LAYOUT.rows;r++)for(let c=0;c<LAYOUT.cols;c++){const d=document.createElement('div'),k=r+','+c;if(LAYOUT.cells[k]){d.className='cell slot';if(placed[k]){d.className='cell filled';d.textContent=LAYOUT.cells[k];}}else d.className='cell empty';g.appendChild(d);}}
function flashJustFilled(){requestAnimationFrame(()=>{document.querySelectorAll('.cell.filled').forEach(c=>{if(!c.dataset.seen){c.dataset.seen='1';c.classList.add('justfilled');setTimeout(()=>c.classList.remove('justfilled'),500);}});});}
function fillWord(word){const w=LAYOUT.words.find(x=>x.word===word);if(!w)return;for(let i=0;i<word.length;i++){const r=w.dir==='H'?w.r:w.r+i,c=w.dir==='H'?w.c+i:w.c;placed[r+','+c]=word[i];}}
let LETTERS=[],positions=[],selected=[],dragging=false;
function placeLetters(){const area=$('wheelArea');area.querySelectorAll('.letter').forEach(e=>e.remove());positions=[];const n=LETTERS.length,cx=132,cy=132,R=92;
  LETTERS.forEach((ch,i)=>{const ang=(-90+i*360/n)*Math.PI/180,x=cx+R*Math.cos(ang),y=cy+R*Math.sin(ang);const el=document.createElement('div');el.className='letter';el.textContent=ch;el.style.left=x+'px';el.style.top=y+'px';area.appendChild(el);positions.push({x,y,el,ch,idx:i});});}
function ptFromEvent(e){const a=$('wheelArea').getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;return{x:t.clientX-a.left,y:t.clientY-a.top};}
function hitLetter(p){for(const L of positions){const dx=p.x-L.x,dy=p.y-L.y;if(dx*dx+dy*dy<30*30)return L;}return null;}
function addSel(L){if(selected.find(s=>s.idx===L.idx))return;selected.push(L);L.el.classList.add('on');buzz(8);$('bubble').textContent=selected.map(s=>s.ch).join('');$('bubble').className='bubble';drawLines();}
function drawLines(p){const svg=$('lines');if(!selected.length){svg.innerHTML='';return;}let d='';selected.forEach((s,i)=>{d+=(i?'L':'M')+s.x+' '+s.y+' ';});if(p)d+='L'+p.x+' '+p.y;svg.innerHTML=`<path d="${d}" stroke="#7C5BFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;}
function startDrag(e){e.preventDefault();ensureMusic();resetIdle();dragging=true;selected=[];const L=hitLetter(ptFromEvent(e));if(L)addSel(L);}
function moveDrag(e){if(!dragging)return;e.preventDefault();const p=ptFromEvent(e);const L=hitLetter(p);if(L){if(selected.length>=2&&L.idx===selected[selected.length-2].idx){const removed=selected.pop();removed.el.classList.remove('on');buzz(6);$('bubble').textContent=selected.map(s=>s.ch).join('');}else{addSel(L);}}drawLines(p);}
function endDrag(e){if(!dragging)return;if(e&&e.cancelable)e.preventDefault();dragging=false;const word=selected.map(s=>s.ch).join('');positions.forEach(L=>L.el.classList.remove('on'));drawLines();evalWord(word);selected=[];}
function showDef(word){const def=KIDBANK[word.toLowerCase()];if(!def)return;const t=$('deftoast');t.innerHTML=`<b>${word}</b> — ${def}`;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function evalWord(word){const b=$('bubble');resetIdle();if(word.length<3){b.textContent='';return;}
  const inGrid=currentLevel.words.includes(word);const isBonus=!inGrid&&bonusList.includes(word);
  if(inGrid&&!found.includes(word)){found.push(word);fillWord(word);renderGrid();gems+=2;$('gems').textContent=gems;b.className='bubble good';b.textContent=word;buzz(30);burst(10);sfxCorrect();burstAtCell(word);flashJustFilled();speak(word);showDef(word);mascotMoment("child found the word "+word+", celebrate","cheer");setTimeout(()=>{b.className='bubble';b.textContent='';},700);if(found.length===currentLevel.words.length)setTimeout(winLevel,650);}
  else if(isBonus&&!bonusFound.includes(word)){bonusFound.push(word);gems+=3;$('gems').textContent=gems;b.className='bubble bonus';b.textContent='Bonus! +3';buzz(30);burst(8);sfxBonus();speak(word);showDef(word);mascotMoment("child found a bonus word "+word,"wow");setTimeout(()=>{b.className='bubble';b.textContent='';},800);}
  else if((inGrid&&found.includes(word))||(isBonus&&bonusFound.includes(word))){b.className='bubble dupe';b.textContent='Already found!';setTimeout(()=>{b.className='bubble';b.textContent='';},700);}
  else{b.className='bubble bad';b.textContent=word;buzz([15,30,15]);sfxWrong();setTimeout(()=>{b.className='bubble';b.textContent='';},600);}}

function starburst(x,y){const wrap=document.createElement('div');wrap.className='starburst';wrap.style.left=x+'px';wrap.style.top=y+'px';
  const cols=['#FFC24B','#54E0B0','#FF7E9D','#7C5BFF','#5AC8FF','#fff'];
  for(let i=0;i<12;i++){const s=document.createElement('i');const ang=i/12*Math.PI*2,dist=34+Math.random()*22;
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.background=cols[i%cols.length];wrap.appendChild(s);}
  document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),700);}
function burstAtCell(word){const w=LAYOUT.words.find(x=>x.word===word);if(!w){return;}
  // center of the word in the grid
  const cells=[...document.querySelectorAll('.cell.filled')];
  const g=$('grid').getBoundingClientRect();starburst(g.left+g.width/2,g.top+g.height/2);}
function fireworks(){const cols=['#FFC24B','#54E0B0','#FF7E9D','#7C5BFF','#5AC8FF','#FFD23F'];
  let shots=0;const launch=()=>{const cx=window.innerWidth*(0.2+Math.random()*0.6),cy=window.innerHeight*(0.2+Math.random()*0.4);
    const wrap=document.createElement('div');wrap.className='fw';wrap.style.left=cx+'px';wrap.style.top=cy+'px';
    const col=cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<18;i++){const s=document.createElement('i');const ang=i/18*Math.PI*2,d=50+Math.random()*40;
      s.style.setProperty('--dx',Math.cos(ang)*d+'px');s.style.setProperty('--dy',Math.sin(ang)*d+'px');s.style.background=col;wrap.appendChild(s);}
    document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),1100);
    shots++;if(shots<6)setTimeout(launch,260+Math.random()*200);};launch();}

function burst(n){const c=$('confetti'),cols=['#FFC24B','#54E0B0','#FF7E9D','#7C5BFF','#5AC8FF'];for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];p.style.animationDuration=(1.4+Math.random()*1.2)+'s';if(Math.random()>.5)p.style.borderRadius='50%';c.appendChild(p);setTimeout(()=>p.remove(),3000);}}

const TRAVEL_ICONS={
  animals:'<circle cx="9.5" cy="13" r="5.5" fill="currentColor" opacity=".16"/><circle cx="9.5" cy="13" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="16.5" cy="8" r="2.6" fill="currentColor" opacity=".16"/><circle cx="16.5" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.6" cy="10.8" r="1.5" fill="#fff" opacity=".9"/>',
  food:'<path d="M12 4c4 0 7 3 7 7 0 4-3 9-7 9s-7-5-7-9c0-4 3-7 7-7Z" fill="currentColor" opacity=".16"/><path d="M12 4c4 0 7 3 7 7 0 4-3 9-7 9s-7-5-7-9c0-4 3-7 7-7Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 4c1-1.6 3-2 3-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',
  space:'<circle cx="11" cy="12" r="5" fill="currentColor" opacity=".18"/><circle cx="11" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><ellipse cx="11" cy="12" rx="9" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.3" transform="rotate(-25 11 12)"/><path d="M18.5 5.2l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4L16.6 7l1.4-.5.5-1.3Z" fill="currentColor"/>',
  nature:'<path d="M12 3l3 5h-2l3 5h-3l2 4h-3v4h-2v-4H7l2-4H6l3-5H7l3-5Z" fill="currentColor" opacity=".18"/><path d="M12 3l3 5h-2l3 5h-3l2 4h-3v4h-2v-4H7l2-4H6l3-5H7l3-5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>',
  home:'<path d="M4 11l8-6 8 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 10v9h12v-9" fill="currentColor" opacity=".16"/><path d="M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><rect x="10.5" y="14" width="3" height="5" fill="none" stroke="currentColor" stroke-width="1.2"/>'
};
function startLevel(){
  if(aiQueued){currentLevel=aiQueued;aiQueued=null;}
  else{currentLevel=generateLevel(3,6);}
  showTravel();          // show transition screen first; beginLevel() runs on tap
}
function showTravel(){
  const L=currentLevel;
  $('travelEyebrow').textContent = (levelNum===1?'Get ready':'Next stop');
  // place text without the leading emoji (we draw a themed icon instead)
  const placeText=L.place.replace(/^\S+\s/,'');
  $('travelPlace').textContent=placeText;
  $('travelLevel').textContent='Level '+levelNum;
  $('travelIco').innerHTML = TRAVEL_ICONS[L.theme]||TRAVEL_ICONS.home;
  $('travelGo').textContent = (levelNum===1?"Start!":"Let's go!");
  $('travel').classList.add('show');
}
function beginLevel(){
  $('travel').classList.remove('show');
  loadLevel();
}
function nextLevel(){levelNum++;startLevel();}

function loadLevel(){found=[];bonusFound=[];placed={};const L=currentLevel;$('place').textContent=L.place;$('lvl').textContent='Level '+levelNum;LETTERS=[...L.letters];const longest=[...L.words].sort((a,b)=>b.length-a.length)[0];let guard=0;do{LETTERS=shuffleArr(LETTERS);guard++;}while(guard<12&&LETTERS.join('')===longest);LAYOUT=placeCrossword(L.words);bonusList=bonusWords(L.letters,L.words);renderGrid();placeLetters();$('bubble').textContent='';$('bubble').className='bubble';$('win').classList.remove('show');mascotMoment("welcome the child to "+L.place,"happy");resetIdle();}
function winLevel(){let defs='';found.concat(bonusFound).forEach(w=>{const d=KIDBANK[w.toLowerCase()];if(d)defs+=`<div><b>${w}</b> — ${d}</div>`;});$('winDefs').innerHTML=defs;const bt=bonusFound.length?` plus ${bonusFound.length} bonus!`:'';$('winText').textContent=`You found all ${found.length} words${bt}`;$('winEm').textContent=["🎉","🌟","🏆","🚀"][lvl%4];$('win').classList.add('show');$('winEm').classList.add('celebrate');setTimeout(()=>$('winEm').classList.remove('celebrate'),800);burst(40);setTimeout(()=>burst(25),300);fireworks();sfxFanfare();mascotMoment("child cleared the level","cheer");speak("Level clear! Great job!");}
async function aiGenerateLevel(){const btn=$('aiLevel');btn.disabled=true;btn.innerHTML='<span class="loader"></span> generating...';
  try{const prompt=`Make a word puzzle level for a kids game (age 4-7). Pick 4-6 letters and 3-5 simple common kid-safe words (3-6 letters) all spellable from those letters using each letter at most once. Concrete & safe only (animals, food, nature, space, home). Reply ONLY JSON: {"place":"<short fun place name>","letters":["A","B","C"],"words":["WORD1","WORD2"]}. No other text.`;
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
    const d=await r.json();let t=(d.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();const obj=JSON.parse(t);
    obj.letters=obj.letters.map(x=>x.toUpperCase());obj.words=obj.words.map(x=>x.toUpperCase()).filter(w=>buildableU(w,obj.letters));
    const lay=placeCrossword(obj.words);if(!lay||lay.words.length!==new Set(obj.words).size||obj.words.length<3)throw 0;
    obj.words=lay.words.map(x=>x.word||x);obj.place="✨ "+(obj.place||"Surprise");
    // add any AI words we don't know to the bank so definitions/bonus still work
    obj.words.forEach(w=>{if(!KIDBANK[w.toLowerCase()])KIDBANK[w.toLowerCase()]="a fun word to learn";});
    aiQueued=obj;levelNum++;startLevel();
  }catch(e){btn.innerHTML='Could not generate, using a new one';levelNum++;startLevel();setTimeout(()=>{btn.disabled=false;btn.textContent='✨ AI surprise level';},1200);return;}
  btn.disabled=false;btn.textContent='✨ AI surprise level';}

let musicOn=false,musicReady=false,usingSynth=false;
function ensureMusic(){ac();if(musicReady)return;const a=$('bgm');a.volume=0.3;a.play().then(()=>{musicOn=true;musicReady=true;usingSynth=false;$('musicBtn').textContent='🎵';}).catch(()=>{});}
$('musicBtn').onclick=()=>{ac();const a=$('bgm');
  if(musicOn){a.pause();bgStop();musicOn=false;$('musicBtn').textContent='🔇';return;}
  a.play().then(()=>{musicOn=true;musicReady=true;usingSynth=false;$('musicBtn').textContent='🎵';})
   .catch(()=>{usingSynth=true;bgStart();musicOn=true;$('musicBtn').textContent='🎵';});};
$('shuffle').onclick=()=>{LETTERS=LETTERS.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);placeLetters();buzz(12);resetIdle();};
$('hintBtn').onclick=()=>{if(gems<10){$('bubble').className='bubble bad';$('bubble').textContent='Need 10';setTimeout(()=>{$('bubble').className='bubble';$('bubble').textContent='';},800);return;}const rem=currentLevel.words.filter(w=>!found.includes(w));if(!rem.length)return;gems-=10;$('gems').textContent=gems;const w=rem[0];found.push(w);fillWord(w);renderGrid();showDef(w);buzz(20);if(found.length===currentLevel.words.length)setTimeout(winLevel,400);};
$('nextLvl').onclick=()=>{nextLevel();};
$('travelGo').onclick=()=>{ac();beginLevel();};
$('aiLevel').onclick=aiGenerateLevel;
document.getElementById('switch').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;document.body.className=btn.dataset.t;[...document.querySelectorAll('#switch button')].forEach(b=>b.classList.toggle('active',b===btn));});
const area=$('wheelArea');
area.addEventListener('mousedown',startDrag);window.addEventListener('mousemove',moveDrag);window.addEventListener('mouseup',endDrag);
area.addEventListener('touchstart',startDrag,{passive:false});area.addEventListener('touchmove',moveDrag,{passive:false});area.addEventListener('touchend',endDrag,{passive:false});area.addEventListener('touchcancel',endDrag,{passive:false});
document.addEventListener('touchmove',e=>{if(dragging)e.preventDefault();},{passive:false});
startLevel();
</script>
